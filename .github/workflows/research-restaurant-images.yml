# Refreshes the 18 Pakse restaurant image records and commits verified matches.
name: Research restaurant images

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - scripts/find-place-images.mjs
      - package.json
      - .github/workflows/research-restaurant-images.yml

permissions:
  contents: write

concurrency:
  group: restaurant-image-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Research all restaurant images
        run: npm run images:restaurants -- --refresh

      - name: Validate production build
        run: npm run build

      - name: Commit research results
        run: |
          if git diff --quiet -- src/data/place-images.generated.json; then
            echo "No restaurant image results changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/place-images.generated.json
          git commit -m "Refresh restaurant image research"
          git push
