name: Resolve Pha Patu images

on:
  push:
    branches:
      - tmp-pha-patu-images

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact image URLs
        shell: bash
        run: |
          python - <<'PY'
          import requests, re, html
          from pathlib import Path

          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          }
          pages = [
              'https://laosuki.com/pha-patu-viewpoint-luang-prabang-sea-of-mist/',
              'https://laosuki.com/wp-json/wp/v2/posts?slug=pha-patu-viewpoint-luang-prabang-sea-of-mist&_embed=1',
              'https://maps.app.goo.gl/khjXjfTfGsjUcGM4A',
          ]
          out = []
          for page in pages:
              r = requests.get(page, headers=headers, allow_redirects=True, timeout=40)
              decoded = html.unescape(r.text).replace('\\/', '/').replace('\\u0026', '&').replace('\\x3d', '=').replace('\\x26', '&')
              out.extend([f'PAGE={page}', f'STATUS={r.status_code}', f'FINAL={r.url}', f'LENGTH={len(decoded)}'])

              candidates = []
              for pattern in [
                  r'<meta[^>]+property=["\']og:image(?::secure_url)?["\'][^>]+content=["\']([^"\']+)',
                  r'<img[^>]+(?:src|data-src|data-lazy-src|data-original)=["\']([^"\']+)',
                  r'(?:srcset|data-srcset)=["\']([^"\']+)',
                  r'https?://[^\s"\'<>\\]+',
              ]:
                  candidates.extend(re.findall(pattern, decoded, re.I))

              # Google Maps often stores only the photo token in page data.
              for token in re.findall(r'AF1Qip[0-9A-Za-z_-]{20,}', decoded):
                  candidates.append(f'https://lh5.googleusercontent.com/p/{token}=w1600-h1200-k-no')

              seen = set()
              for raw in candidates:
                  for candidate in str(raw).split(','):
                      candidate = candidate.strip().split(' ')[0].rstrip(']});,')
                      if candidate.startswith('//'):
                          candidate = 'https:' + candidate
                      if not candidate.startswith('http') or candidate in seen:
                          continue
                      low = candidate.lower()
                      is_file = any(ext in low.split('?')[0] for ext in ('.jpg', '.jpeg', '.png', '.webp', '.avif'))
                      is_google_photo = ('googleusercontent.com/p/' in low or 'ggpht.com/p/' in low or 'googleusercontent.com/proxy/' in low)
                      if not (is_file or is_google_photo):
                          continue
                      seen.add(candidate)
                      out.append('IMAGE=' + candidate)
              out.append('---')

          Path('pha-patu-image-candidates.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pha-patu-image-candidates.txt
          git commit -m "Decode Google Maps Pha Patu photo ids"
          git push
