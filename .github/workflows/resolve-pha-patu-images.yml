name: Build Pha Patu gallery images

on:
  push:
    branches:
      - tmp-pha-patu-images

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python -m pip install --quiet requests pillow
      - name: Download and optimise exact Pha Patu images
        shell: bash
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          import requests
          from PIL import Image, ImageOps

          headers = {'User-Agent': 'Mozilla/5.0'}
          images = [
              (
                  'https://f.ptcdn.info/949/067/000/q4zfcth9fGTOzjddHui-o.jpg',
                  'public/images/laos/landmarks/pha-pa-tou-01.jpg',
              ),
              (
                  'https://laosuki.com/wp-content/uploads/2025/12/pha-patu-viewpoint-sea-of-mist-luang-prabang.jpg',
                  'public/images/laos/landmarks/pha-pa-tou-02.jpg',
              ),
              (
                  'https://p19-common-sign.tiktokcdn-us.com/tos-alisg-p-0037/o0UuixAMEEx57OAB6qpE3DKCNIBHUeAfgA6FAR~tplv-tiktokx-origin.image?dr=9636&x-expires=1785333600&x-signature=TzyBMG2Ckm01iGyJZG1vxOZwLfk%3D&t=4d5b0474&ps=13740610&shp=81f88b70&shcp=43f4a2f9&idc=useast8',
                  'public/images/laos/landmarks/pha-pa-tou-03.jpg',
              ),
          ]

          for url, path_str in images:
              response = requests.get(url, headers=headers, timeout=60)
              response.raise_for_status()
              image = Image.open(io.BytesIO(response.content))
              image = ImageOps.exif_transpose(image).convert('RGB')
              image.thumbnail((1800, 1400), Image.Resampling.LANCZOS)
              path = Path(path_str)
              path.parent.mkdir(parents=True, exist_ok=True)
              image.save(path, 'JPEG', quality=88, optimize=True, progressive=True)
              print(path, image.size, path.stat().st_size)
          PY
      - name: Commit gallery files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/images/laos/landmarks/pha-pa-tou-01.jpg public/images/laos/landmarks/pha-pa-tou-02.jpg public/images/laos/landmarks/pha-pa-tou-03.jpg
          git commit -m "Add stable Pha Patu gallery images"
          git push
