name: Finalise Pha Patu landmark

on:
  push:
    branches:
      - tmp-pha-patu-images

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gallery and marker geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/laos.astro')
          text = path.read_text(encoding='utf-8')

          old_gallery = """const phaPaTouGallery = [
  {
    src: 'https://f.ptcdn.info/949/067/000/q4zfcth9fGTOzjddHui-o.jpg',
    alt: 'Sunrise over the mountain landscape from Pha Pa Tou in Luang Prabang Province',
    sourcePage: 'https://pantip.com/topic/39606086',
    author: 'Pantip travel report'
  }
];"""

          new_gallery = """const phaPaTouGallery = [
  {
    src: '/images/laos/landmarks/pha-pa-tou-01.jpg',
    alt: 'Sunrise over the mountain landscape from Pha Pa Tou in Luang Prabang Province',
    sourcePage: 'https://pantip.com/topic/39606086',
    author: 'Sittichai · Pantip travel report'
  },
  {
    src: '/images/laos/landmarks/pha-pa-tou-02.jpg',
    alt: 'Sea of mist surrounding Pha Patu in Luang Prabang Province',
    sourcePage: 'https://laosuki.com/pha-patu-viewpoint-luang-prabang-sea-of-mist/',
    author: 'OKIHIRO · Laosuki'
  },
  {
    src: '/images/laos/landmarks/pha-pa-tou-03.jpg',
    alt: 'Mountain viewpoint scenery at Pha Patu above Pak Ou',
    sourcePage: 'https://www.tiktok.com/@makame__/video/7581713947250855176',
    author: 'makame__ · TikTok'
  }
];"""

          old_marker = """            <path class=\"city-marker__leader\" d={`M${phaPaTou.x + 12} ${phaPaTou.y} L${phaPaTou.x + 74} ${phaPaTou.y}`} />
            <text class=\"city-marker__label city-marker__label--landmark\" x={phaPaTou.x + 82} y={phaPaTou.y + 8}>Pha Pa Tou</text>"""

          new_marker = """            <path class=\"city-marker__leader\" d={`M${phaPaTou.x + 10} ${phaPaTou.y} L${phaPaTou.x + 66} ${phaPaTou.y - 41}`} />
            <text class=\"city-marker__label city-marker__label--landmark\" x={phaPaTou.x + 74} y={phaPaTou.y - 45}>Pha Pa Tou</text>"""

          if text.count(old_gallery) != 1:
              raise RuntimeError(f'Expected one Pha Pa Tou gallery, found {text.count(old_gallery)}')
          if text.count(old_marker) != 1:
              raise RuntimeError(f'Expected one Pha Pa Tou marker, found {text.count(old_marker)}')

          text = text.replace(old_gallery, new_gallery, 1)
          text = text.replace(old_marker, new_marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary files and commit
        run: |
          rm -f pha-patu-image-candidates.txt
          rm -f .github/workflows/resolve-pha-patu-images.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Pha Patu leader and add gallery photos"
          git push
