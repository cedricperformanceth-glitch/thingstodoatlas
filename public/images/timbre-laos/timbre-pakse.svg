<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220" role="img" aria-labelledby="title desc">
  <title id="title">Vintage Pakse postage stamp</title>
  <desc id="desc">A vector Lao postage stamp with an elephant, a golden temple spire and an ornate blue frame.</desc>
  <defs>
    <filter id="paper" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.48" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feComponentTransfer in="grain" result="fadedGrain">
        <feFuncA type="table" tableValues="0 0.11"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fadedGrain" mode="multiply"/>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="0.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="artClip">
      <rect x="31" y="65" width="118" height="103" rx="1.5"/>
    </clipPath>
  </defs>

  <g fill="#efe5cd" filter="url(#paper)">
    <rect x="9" y="9" width="162" height="202" rx="2"/>
    <g>
